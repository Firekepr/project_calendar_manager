name: project_calendar_manager
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flex_color_picker               : ^3.4.1      # https://pub.dev/packages/flex_color_picker
  flutter_material_color_picker   : ^1.2.0      # https://pub.dev/packages/flutter_material_color_picker
  path_provider                   : ^2.1.3      # https://pub.dev/packages/path_provider
  path                            : 1.9.0       # https://pub.dev/packages/path
  reactive_forms                  : ^17.0.0     # https://pub.dev/packages/reactive_forms
  sqflite                         : ^2.3.3+1    # https://pub.dev/packages/sqflite
  table_calendar                  : ^3.1.1      # https://pub.dev/packages/table_calendar
  provider                        : ^6.1.2      # https://pub.dev/packages/provider
  cupertino_icons                 : ^1.0.6

  flutter_localizations:
    sdk: flutter

dependency_overrides:
  intl: ^0.19.0                                 # https://pub.dev/packages/intl

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true